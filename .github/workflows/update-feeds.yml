name: Update journal RSS feeds

on:
  schedule:
    - cron: "0 2 * * *"      # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 每本期刊独立一步，continue-on-error 保证单站故障不拖垮整轮
      - name: Accounts of Materials Research (Crossref)
        continue-on-error: true
        run: |
          python scripts/feedgen_crossref.py \
            --issn 2643-6728 \
            --name "Accounts of Materials Research" \
            --site https://pubs.acs.org/amrcda \
            --limit 30 \
            --out feeds/amr.xml \
            --mailto doubao-rss@users.noreply.github.com

      - name: Chemical Reviews (Crossref)
        continue-on-error: true
        run: |
          python scripts/feedgen_crossref.py \
            --issn 0009-2665 \
            --name "Chemical Reviews" \
            --site https://pubs.acs.org/journal/chreay \
            --limit 30 \
            --out feeds/chemrev.xml \
            --mailto doubao-rss@users.noreply.github.com

      - name: Journal of Chemical Education (Crossref)
        continue-on-error: true
        run: |
          python scripts/feedgen_crossref.py \
            --issn 0021-9584 \
            --name "Journal of Chemical Education" \
            --site https://pubs.acs.org/journal/jceda8 \
            --limit 30 \
            --out feeds/jce.xml \
            --mailto doubao-rss@users.noreply.github.com

      - name: 物理学进展 (sitemap)
        continue-on-error: true
        run: |
          python scripts/feedgen_journal.py \
            --site https://pip.nju.edu.cn \
            --name "物理学进展" \
            --sitemap "/sitemap-index.xml" \
            --article-pattern "/CN/abstract/article/" \
            --limit 25 \
            --out feeds/physics-progress.xml

      - name: 电源技术 (sitemap)
        continue-on-error: true
        run: |
          python scripts/feedgen_journal.py \
            --site https://manu70.magtech.com.cn \
            --name "电源技术" \
            --sitemap "/dyjs/sitemap-index.xml" \
            --article-pattern "/dyjs/CN/abstract/article/" \
            --limit 30 \
            --out feeds/dyjs.xml

      - name: 化学进展 (sitemap)
        continue-on-error: true
        run: |
          python scripts/feedgen_journal.py \
            --site https://hxjz.magtechjournal.com \
            --name "化学进展" \
            --sitemap "/sitemaps/sitemap-index.xml" \
            --article-pattern "/CN/10.7536/|/CN/10.3724/" \
            --limit 30 \
            --out feeds/progchem.xml

      - name: 中国工程科学 (sitemap)
        continue-on-error: true
        run: |
          python scripts/feedgen_journal.py \
            --site https://www.engineering.org.cn \
            --name "中国工程科学" \
            --sitemap "/sitemaps/sscae/CN/sitemap-1.xml" \
            --article-pattern "/sscae/CN/" \
            --limit 30 \
            --out feeds/sscae.xml

      - name: 功能材料 (列表页)
        continue-on-error: true
        run: |
          python scripts/feedgen_journal.py \
            --site https://www.gncl.cn \
            --name "功能材料" \
            --list-url "https://www.gncl.cn/CN/home" \
            --link-pattern "/CN/10\\." \
            --limit 30 --workers 5 \
            --out feeds/gncl.xml

      - name: 材料导报 (列表页)
        continue-on-error: true
        run: |
          python scripts/feedgen_journal.py \
            --site https://www.mater-rep.com \
            --name "材料导报" \
            --list-url "https://www.mater-rep.com/CN/1005-023X/home.shtml" \
            --link-pattern "/CN/10\\." \
            --limit 30 --workers 5 \
            --out feeds/mater-rep.xml

      - name: 金属学报 (多期目录)
        continue-on-error: true
        run: |
          python scripts/feedgen_journal.py \
            --site https://www.ams.org.cn \
            --name "金属学报" \
            --list-url "https://www.ams.org.cn/CN/0412-1961/home.shtml,https://www.ams.org.cn/CN/Y2026/V62/I10,https://www.ams.org.cn/CN/Y2026/V62/I9,https://www.ams.org.cn/CN/Y2026/V62/I8" \
            --link-pattern "/CN/10\\." \
            --limit 30 --workers 6 \
            --out feeds/ams.xml

      - name: Electrochemical Energy Reviews (Springer 列表页)
        continue-on-error: true
        run: |
          python scripts/feedgen_journal.py \
            --site https://link.springer.com \
            --name "Electrochemical Energy Reviews" \
            --list-url "https://link.springer.com/journal/41918/articles" \
            --link-pattern "/article/10\\.1007/s41918" \
            --limit 30 --workers 6 \
            --out feeds/eer.xml

      - name: 校验产物
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob("feeds/*.xml")):
              r = ET.parse(f).getroot()
              items = r.findall(".//item")
              print(f"{f}: {len(items)} 条")
              assert len(items) > 0, f"{f} 为空"
          PY

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: update feeds ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi
