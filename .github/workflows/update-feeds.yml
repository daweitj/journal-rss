name: Update journal RSS feeds

on:
  schedule:
    - cron: "0 2 * * *"      # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:                   # 只在此类改动时自动重跑，避免文档改动也触发
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 订阅清单在 config/journals.json，新增期刊只改那份 JSON
      - name: 生成各刊 feed
        run: python scripts/build_all.py

      - name: 校验产物
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob("feeds/*.xml")):
              items = ET.parse(f).getroot().findall(".//item")
              print(f"{f}: {len(items)} 条")
              assert len(items) > 0, f"{f} 为空"
          PY

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: update feeds ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi
